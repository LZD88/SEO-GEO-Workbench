<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>曜见 YaoSight · 团队工作台</title>
  <link rel="stylesheet" href="/workspace.css">
  <script type="module" src="/workspace.js"></script>
</head>
<body>
  <header><strong>曜见 <span>YaoSight</span></strong><form id="logout" method="post" action="/auth/logout" hidden><button>退出</button></form></header>
  <main>
    <h1>团队工作台</h1>
    <p>选一个站点项目，查看 AI 有没有提到你的品牌，或检查网站需要改进的地方。</p>
    <p id="feedback" role="status"></p>
    <a id="login" href="/auth/login" hidden>登录工作空间</a>
    <div id="workspace" hidden>
      <label>工作空间 <select id="spaces"></select></label>
      <section>
        <h2>站点项目</h2>
        <ul id="projects"></ul>
        <form id="new-project" hidden>
          <label>项目名称 <input name="name" required maxlength="100"></label>
          <button>创建项目</button>
        </form>
      </section>
      <section id="project" hidden>
        <h2 id="project-title">项目检测</h2>
        <form id="new-geo" hidden>
          <label>目标类型 <select name="kind"><option value="brand">品牌</option><option value="article">文章</option></select></label>
          <label>品牌或文章名 <input name="name" maxlength="120" required></label>
          <label>网址 <input name="url" type="url" required></label>
          <label>想让 AI 回答什么？ <input name="question" maxlength="240" placeholder="例如：有哪些适合小团队的协作工具？"></label>
          <fieldset><legend>选择 AI 平台</legend><div id="geo-platforms"></div></fieldset>
          <button>开始检测</button>
        </form>
        <div id="article-tools" hidden>
          <h3>文章优化</h3>
          <form id="article-source">
            <label>公开文章链接 <input name="url" type="url" required></label>
            <button>读取文章</button>
          </form>
          <p id="article-source-status"></p>
          <form id="article-optimization">
            <label>文章标题 <input name="title" required maxlength="180"></label>
            <label>正文 <textarea name="text" maxlength="12000" rows="5"></textarea></label>
            <label>从 GEO 检测记录选择 <select name="checkId"><option value="">直接填写或导入新文章</option></select></label>
            <p id="article-evidence-status" role="status"></p>
            <label>识图模型 <select name="platform" required></select></label>
            <button>生成优化报告</button>
          </form>
        </div>
        <div id="site-tools" hidden>
          <h3>技术 SEO 审计</h3>
          <form id="site-challenge"><label>站点域名 <input name="domain" required></label><button>生成 DNS 验证值</button></form>
          <p id="site-state"></p>
          <button id="seo-demo" type="button" hidden>查看审计样例</button>
          <button id="site-verify" type="button" hidden>检查 DNS 记录</button>
          <form id="start-seo" hidden>
            <label>入口网址 <input name="url" type="url" required></label>

            <button>开始审计</button>
          </form>
        </div>
        <div id="monitor-tools">
          <h3>定期监测</h3>
          <form id="monitor-form" hidden>
            <label>计划名称 <input name="name" required maxlength="100"></label>
            <label>频率 <select name="cadence"><option value="daily">每天</option><option value="weekly">每周</option></select></label>
            <label>每行一个 GEO 问题 <textarea name="questions" rows="3"></textarea></label>
            <label>想比较的其他品牌（选填，每行一个品牌名） <textarea name="competitors" rows="2"></textarea></label>
            <label><input name="active" type="checkbox"> 启用定期执行</label>
            <button type="button" id="save-geo-monitor">保存 GEO 计划</button>
            <button type="button" id="save-seo-monitor" hidden>保存 SEO 计划</button>
          </form>
          <p id="monitor-feedback"></p>
          <ul id="monitors"></ul>
        </div>
        <h3>检测历史</h3>
        <ul id="jobs"></ul>
        <button id="refresh-jobs" type="button">刷新历史</button>
        <div id="job-details" hidden></div>
      </section>
      <section id="team" hidden>
        <h2>成员</h2>
        <ul id="members"></ul>
        <form id="invite">
          <label>邀请邮箱 <input name="email" type="email" required maxlength="254"></label>
          <label>角色 <select name="role"><option value="viewer">查看者</option><option value="editor">编辑者</option><option value="owner">所有者</option></select></label>
          <button>生成邀请</button>
        </form>
        <output id="invite-link"></output>
      </section>
    </div>
  </main>
</body>
</html>
