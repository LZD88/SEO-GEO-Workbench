<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>曜见 YaoSight · 管理员后台</title>
  <link rel="stylesheet" href="/admin.css">
  <script type="module" src="/admin.js"></script>
</head>
<body>
  <header>
    <a href="/admin" class="brand"><span class="brand-icon" aria-hidden="true">Y</span> 曜见 <small>YaoSight</small></a>
    <div class="header-actions"><a href="/dashboard">返回工作台</a><button type="button" id="sign-out" hidden>退出</button></div>
  </header>
  <main>
    <h1>管理员后台</h1>
    <p id="message" role="status"></p>
    <section id="sign-in" class="panel sign-in" hidden>
      <h2>管理员登录</h2>
      <p id="setup" hidden>请在项目目录运行 <code>powershell.exe -NoProfile -File .\setup-admin.ps1</code>，设置管理员密码后刷新页面。</p>
      <form id="login">
        <label for="password">管理员密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" minLength="8" maxlength="128" required>
        <button class="primary" type="submit">登录</button>
      </form>
    </section>
    <div id="console" hidden>
      <div class="operations-heading"><p>评测策略、渠道状态与原始运行记录。</p><button id="refresh" type="button">刷新记录</button></div>
      <div class="config-grid">
        <section class="panel">
          <h2>GEO 评测策略</h2>
          <form id="settings">
            <label for="samples">每平台采样次数</label>
            <select id="samples" name="sampleCount"><option>1</option><option>3</option><option>5</option></select>
            <label class="toggle"><input name="webSearch" type="checkbox"> 对支持的平台请求联网</label>
            <p>设置在下一次新建检测时生效。同题复测使用原运行条件。</p>
            <button type="submit" class="primary">保存策略</button>
          </form>
        </section>
        <section class="panel">
          <h2>SEO 抓取策略</h2>
          <dl id="seo-limits"></dl>
        </section>
      </div>
      <section class="panel">
        <h2>模型渠道</h2>
        <div class="table-scroll">
          <table><thead><tr><th>平台</th><th>渠道</th><th>配置模型</th><th>可用性</th><th>能力</th><th>最近成功</th></tr></thead><tbody id="channels"></tbody></table>
        </div>
      </section>
      <section class="panel">
        <h2>GEO 运行记录</h2>
        <ul id="geo" class="records"></ul>
        <section id="diagnostic" hidden aria-live="polite"></section>
      </section>
      <section class="panel">
        <h2>SEO 原始报告</h2>
        <ul id="seo" class="records"></ul>
      </section>
    </div>
  </main>
</body>
</html>
